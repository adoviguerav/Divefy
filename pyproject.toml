[project]
name = "divefy"
version = "0.1.0"
description = "Copiloto conversacional RAG de seguridad en buceo, sobre un banco de experimentos"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.121.0",
    "google-genai>=2.19.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.24",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "transformers>=5.8.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: corre el parser Docling en vivo sobre el PDF real (minutos, no en el gate rápido)"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divefy"]
