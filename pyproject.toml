[project]
name = "divefy"
version = "0.1.0"
description = "Copiloto conversacional RAG de seguridad en buceo, sobre un banco de experimentos"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.121.0",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: corre el parser Docling en vivo sobre el PDF real (minutos, no en el gate rápido)"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divefy"]
