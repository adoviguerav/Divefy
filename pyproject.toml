[project]
name = "divefy"
version = "0.1.0"
description = "Copiloto conversacional RAG de seguridad en buceo, sobre un banco de experimentos"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.121.0",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divefy"]
